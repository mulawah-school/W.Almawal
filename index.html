<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الكنترول والمراقب الذكي</title>
    <!-- Tailwind CSS للتحكم الكامل بالتنسيق والألوان -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبات React الأساسية لتشغيل الكود في المتصفح مباشرة -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- مترجم البابل لتفسير كود الـ JSX داخل المتصفح -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- الحفظ السحابي عبر Google Apps Script: كل مدرسة تدخل برابطها الخاص (?s=رمز) وتظهر بياناتها فقط -->
    <script>
        window.cloudDB = null;
        window.currentSchoolId = null;
        window.currentSchoolInfo = null;
        window.CONTROL_APP_AUTH_READY = false;
        window.addEventListener('error', function(e) {
            try {
                const el = document.getElementById('control-login-error');
                if (el && !window.CONTROL_APP_AUTH_READY) el.textContent = 'حدث خطأ في تحميل ملفات البرنامج. تأكد من الاتصال بالإنترنت وفتح الملف من رابط مستضاف.';
            } catch(_) {}
        });
    </script>
    <script type="module">
        // ⚙️ ضع هنا رابط تطبيق الويب الخاص بسكربت المراقب الذكي (Apps Script ← نشر ← رابط ينتهي بـ /exec)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3oOr7QYd1M0B9P2ZvsNeD3xJzRSo2ZtQNIdnFlVoPN9omAIiHtSkly-t1U8sCS7IFiQ/exec';

        // ===== طبقة الاتصال بالسكربت (بديل قاعدة البيانات السحابية) =====
        const CLOUD_POLL_MS = 15000;
        const cloudDbHandle = { kind: 'apps-script' };
        const db = cloudDbHandle;
        let cloudQueue = [];
        let cloudFlushTimer = null;

        async function scriptPost(body) {
            if (!SCRIPT_URL) throw new Error('SCRIPT_NOT_CONFIGURED');
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(body),
                cache: 'no-store',
                redirect: 'follow'
            });
            const j = await res.json();
            if (!j || !j.ok) {
                const e = new Error((j && j.error) || 'تعذر الاتصال بالسكربت');
                e.code = (j && j.error) || 'script-error';
                throw e;
            }
            return j;
        }
        function flushCloudQueue() {
            cloudFlushTimer = null;
            const batch = cloudQueue;
            cloudQueue = [];
            if (!batch.length) return;
            const code = window.currentSchoolId;
            scriptPost({ action: 'batch', s: code, ops: batch.map(x => x.op) })
                .then(j => {
                    batch.forEach((x, i) => {
                        const r = (j.results || [])[i] || { error: 'no result' };
                        if (r.error) { const e = new Error(r.error); e.code = r.error; x.reject(e); }
                        else x.resolve(r);
                    });
                })
                .catch(err => batch.forEach(x => x.reject(err)));
        }
        function cloudOp(op) {
            if (!window.currentSchoolId) return Promise.reject(new Error('NO_SCHOOL'));
            return new Promise((resolve, reject) => {
                cloudQueue.push({ op, resolve, reject });
                if (!cloudFlushTimer) cloudFlushTimer = setTimeout(flushCloudQueue, 30);
            });
        }
        function flattenSegs(segs) {
            return segs.flatMap(s => String(s == null ? '' : s).split('/')).filter(s => s !== '');
        }
        function relativeSchoolPath(segs) {
            if (segs[0] === 'schools' && segs.length >= 2) {
                if (segs[1] !== window.currentSchoolId) throw new Error('مسار مدرسة أخرى غير مسموح');
                const rest = segs.slice(2);
                return rest.length ? rest : ['_school', 'info'];
            }
            return segs;
        }
        function fbDoc(database, ...path) {
            const segs = flattenSegs(path);
            return { type: 'doc', segs, id: segs[segs.length - 1], get path() { return relativeSchoolPath(segs).join('/'); } };
        }
        function fbCollection(database, ...path) {
            const segs = flattenSegs(path);
            return { type: 'collection', segs, id: segs[segs.length - 1], get path() { return relativeSchoolPath(segs).join('/'); } };
        }
        function serverTimestamp() { return { __sv: 'ts' }; }
        function arrayUnion(...values) { return { __sv: 'union', v: values }; }
        function cloneData(v) { try { return v == null ? v : JSON.parse(JSON.stringify(v)); } catch (e) { return v; } }
        function makeDocSnap(ref, exists, data) {
            return { id: ref.id, ref, exists: () => !!exists, data: () => (exists ? cloneData(data) : undefined) };
        }
        function makeQuerySnap(docs, changes) {
            return {
                docs, size: docs.length, empty: docs.length === 0,
                forEach: fn => docs.forEach(fn),
                docChanges: () => changes
            };
        }
        const knownDocs = new Map();

        async function getDoc(ref) {
            const path = ref.path;
            const known = knownDocs.get(path);
            const r = await cloudOp({ op: 'get', path, rev: known ? known.rev : 0 });
            if (!r.exists) { knownDocs.delete(path); return makeDocSnap(ref, false); }
            if (r.same && known) return makeDocSnap(ref, true, known.data);
            knownDocs.set(path, { rev: r.rev, data: r.data });
            return makeDocSnap(ref, true, r.data);
        }
        async function setDoc(ref, data, options = {}) {
            const r = await cloudOp({ op: 'set', path: ref.path, data: cloneData(data), merge: !!(options && options.merge) });
            knownDocs.delete(ref.path);
            return r;
        }
        async function deleteDoc(ref) {
            knownDocs.delete(ref.path);
            return cloudOp({ op: 'del', path: ref.path });
        }
        async function listCollection(ref, knownMap) {
            const known = {};
            Object.keys(knownMap || {}).forEach(id => { known[id] = knownMap[id].rev; });
            const r = await cloudOp({ op: 'list', path: ref.path, known });
            const next = {};
            (r.docs || []).forEach(d => {
                next[d.id] = d.same && knownMap && knownMap[d.id] ? knownMap[d.id] : { rev: d.rev, data: d.data };
            });
            return next;
        }
        function docFromEntry(collRef, id, entry) {
            const ref = fbDoc(cloudDbHandle, ...collRef.segs, id);
            return makeDocSnap(ref, true, entry.data);
        }
        async function getDocs(ref) {
            const map = await listCollection(ref, null);
            const docs = Object.keys(map).map(id => docFromEntry(ref, id, map[id]));
            return makeQuerySnap(docs, docs.map(doc => ({ type: 'added', doc })));
        }
        function onSnapshot(ref, next, onError) {
            let stopped = false;
            let timer = null;
            let lastRev = null;
            let collState = null;
            let errorShown = false;
            const tick = async () => {
                if (stopped) return;
                if (document.visibilityState === 'hidden' && (lastRev !== null || collState)) { schedule(); return; }
                try {
                    if (ref.type === 'doc') {
                        const before = knownDocs.get(ref.path);
                        const snap = await getDoc(ref);
                        const now = knownDocs.get(ref.path);
                        const rev = now ? now.rev : 0;
                        if (!stopped && (lastRev === null || rev !== lastRev)) { lastRev = rev; next(snap); }
                        void before;
                    } else {
                        const prev = collState;
                        const map = await listCollection(ref, prev);
                        const changes = [];
                        Object.keys(map).forEach(id => {
                            if (!prev || !prev[id]) changes.push({ type: 'added', doc: docFromEntry(ref, id, map[id]) });
                            else if (prev[id].rev !== map[id].rev) changes.push({ type: 'modified', doc: docFromEntry(ref, id, map[id]) });
                        });
                        if (prev) Object.keys(prev).forEach(id => { if (!map[id]) changes.push({ type: 'removed', doc: docFromEntry(ref, id, prev[id]) }); });
                        collState = map;
                        if (!stopped && (!prev || changes.length)) {
                            next(makeQuerySnap(Object.keys(map).map(id => docFromEntry(ref, id, map[id])), changes));
                        }
                    }
                    errorShown = false;
                } catch (e) {
                    console.warn('تعذر تحديث البيانات من السحابة', e);
                    if (!errorShown && typeof onError === 'function') { errorShown = true; try { onError(e); } catch (_) {} }
                }
                schedule();
            };
            const schedule = () => { if (!stopped) timer = setTimeout(tick, CLOUD_POLL_MS); };
            tick();
            return () => { stopped = true; clearTimeout(timer); };
        }

        const AUTH_LAST_ACTIVITY_KEY = 'control_auth_last_activity_v1';
        let storageSaveTimer = null;
        let restoringSchoolStorage = false;
        let lastOpenedSchoolCode = null;
        const SCHOOL_LINK_STORAGE_KEY = 'control_school_link_code_v1';

        function setLoginError(message) {
            const el = document.getElementById('control-login-error');
            if (el) el.textContent = message || '';
        }
        function setAuthStatus(message, mode = 'neutral') {
            const el = document.getElementById('control-auth-status');
            if (!el) return;
            el.textContent = message || '';
            el.style.background = mode === 'success' ? '#dcfce7' : mode === 'error' ? '#fee2e2' : mode === 'loading' ? '#dbeafe' : '#f1f5f9';
            el.style.color = mode === 'success' ? '#166534' : mode === 'error' ? '#991b1b' : mode === 'loading' ? '#1e40af' : '#475569';
        }
        function showLogin() {
            const login = document.getElementById('control-login-screen');
            const root = document.getElementById('root');
            if (login) login.style.display = 'flex';
            if (root) root.style.display = 'none';
        }
        function showApp() {
            const login = document.getElementById('control-login-screen');
            const root = document.getElementById('root');
            if (login) login.style.display = 'none';
            if (root) root.style.display = 'block';
        }
        function markActivity() {
            try { localStorage.setItem(AUTH_LAST_ACTIVITY_KEY, String(Date.now())); } catch(e) {}
        }
        ['click','keydown','input','mousemove','touchstart'].forEach(evt => {
            window.addEventListener(evt, () => { if (window.currentSchoolId) markActivity(); }, { passive: true });
        });

        function shouldPersistLocalKey(key) {
            return /^(monitoring_|savedExamDate$|smart_monitor)/.test(String(key || '')) || String(key || '') === 'exam_control_committee_signatures_global';
        }
        function cleanupSchoolScopedLocalStorage() {
            const keys = [];
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (/^(monitoring_|savedExamDate$|control_bridge_|exam_sessions_|exam_envelopes_|exam_daily_notes_|exam_proctoring_extra_|exam_second_period_proctoring_|exam_individual_absentee_|exam_violation_|exam_signatures_|exam_signature_deletes_)/.test(k || '') || k === 'exam_control_committee_signatures_global' || k === 'monitoring_control_bridge_v1' || k === 'control_proctoring_clean_version') keys.push(k);
                }
                keys.forEach(k => localStorage.removeItem(k));
            } catch(e) { console.warn('تعذر تنظيف التخزين المحلي المؤقت', e); }
        }
        async function restoreSchoolLocalStorage(schoolId) {
            cleanupSchoolScopedLocalStorage();
            if (!schoolId) return;
            restoringSchoolStorage = true;
            try {
                const snap = await getDoc(fbDoc(db, 'schools', schoolId, 'controlLocalStorage', 'snapshot'));
                if (snap.exists()) {
                    const data = snap.data() || {};
                    const items = data.items || {};
                    Object.keys(items).forEach(k => {
                        if (shouldPersistLocalKey(k) && typeof items[k] === 'string') localStorage.setItem(k, items[k]);
                    });
                }
            } catch(e) {
                console.warn('تعذر استرجاع بيانات المراقب الذكي من السحابة', e);
            } finally {
                restoringSchoolStorage = false;
            }
        }

        async function restoreMonitoringAppDataFromCloud(schoolId) {
            if (!schoolId) return false;
            try {
                let data = {};
                let hasData = false;
                try {
                    const snap = await getDoc(fbDoc(db, 'schools', schoolId, 'monitoring', 'appData'));
                    if (snap.exists()) {
                        data = snap.data() || {};
                        hasData = true;
                    }
                } catch(innerAppErr) {
                    console.warn('تعذر قراءة بيانات المراقب الذكي الكاملة من السحابة', innerAppErr);
                }
                try {
                    const teachersSnap = await getDoc(fbDoc(db, 'schools', schoolId, 'monitoring', 'teachers'));
                    if (teachersSnap.exists()) {
                        const teachersData = teachersSnap.data() || {};
                        if (Array.isArray(teachersData.teachers)) {
                            data = { ...data, teachers: teachersData.teachers };
                            hasData = true;
                        }
                    }
                } catch(innerTeachersErr) {
                    console.warn('تعذر قراءة نسخة المعلمين المباشرة من السحابة', innerTeachersErr);
                }
                if (!hasData) return false;
                try {
                    const stateString = JSON.stringify(data || {});
                    localStorage.setItem('monitoring_distribution_full_state_v4', stateString);
                    try { localStorage.setItem(`monitoring_distribution_full_state_v4_${schoolId}`, stateString); } catch(e) {}
                } catch(e) { console.warn('تعذر تجهيز بيانات المراقب الذكي محليًا', e); }
                return true;
            } catch(e) {
                console.warn('تعذر استرجاع بيانات المراقب الذكي المباشرة من السحابة', e);
                return false;
            }
        }

        function cleanCloudValue(value) {
            if (value === undefined) return null;
            if (value === null) return null;
            if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
            if (typeof value === 'string' || typeof value === 'boolean') return value;
            if (Array.isArray(value)) return value.map(item => cleanCloudValue(item));
            if (value && typeof value === 'object') {
                const out = {};
                Object.keys(value).forEach(key => {
                    const cleaned = cleanCloudValue(value[key]);
                    if (cleaned !== undefined) out[key] = cleaned;
                });
                return out;
            }
            return String(value || '');
        }

        let monitoringAppSaveTimer = null;
        let monitoringImmediateSaveInFlight = false;
        let monitoringImmediateSaveQueued = false;
        function getMonitoringIframeApp() {
            try {
                const frames = Array.from(document.querySelectorAll('iframe'));
                for (const frame of frames) {
                    const app = frame.contentWindow && frame.contentWindow.monitoringDistributionApp;
                    if (app && typeof app.getSerializableState === 'function') return app;
                }
            } catch(e) {}
            return null;
        }
        let monitoringPayloadSaveInFlight = false;
        let monitoringPayloadSaveQueued = null;
        let monitoringPayloadDebounceTimer = null;
        let monitoringPayloadDebounced = null;
        function scheduleMonitoringStatePayloadSave(payload = {}, options = {}) {
            monitoringPayloadDebounced = { payload, options };
            clearTimeout(monitoringPayloadDebounceTimer);
            monitoringPayloadDebounceTimer = setTimeout(() => {
                const next = monitoringPayloadDebounced;
                monitoringPayloadDebounced = null;
                if (next) queueMonitoringStatePayloadSave(next.payload, next.options || {});
            }, 1000);
            return true;
        }
        async function saveMonitoringStatePayloadNow(payload = {}, options = {}) {
            if (!window.currentSchoolId) return false;
            let state = payload && payload.state ? payload.state : payload;
            if (!state || typeof state !== 'object') return false;
            try {
                state = cleanCloudValue(state);
                const stateString = JSON.stringify(state);
                try { localStorage.setItem('monitoring_distribution_full_state_v4', stateString); } catch(e) {}
                try { localStorage.setItem(`monitoring_distribution_full_state_v4_${window.currentSchoolId}`, stateString); } catch(e) {}
                try { window.__LAST_MONITORING_STATE_STRING = stateString; } catch(e) {}
                const nowIso = new Date().toISOString();
                await setDoc(fbDoc(db, 'schools', window.currentSchoolId, 'monitoring', 'appData'), {
                    ...state,
                    updatedAt: serverTimestamp(),
                    updatedAtLocal: nowIso,
                    forcedSaveReason: options.reason || payload.reason || 'payload_direct_save',
                    clientSavedAt: payload.clientSavedAt || Date.now()
                }, { merge: true });
                const teachers = Array.isArray(state.teachers) ? state.teachers : (Array.isArray(payload.teachers) ? payload.teachers : null);
                if (teachers) {
                    await setDoc(fbDoc(db, 'schools', window.currentSchoolId, 'monitoring', 'teachers'), {
                        teachers: cleanCloudValue(teachers),
                        updatedAt: serverTimestamp(),
                        updatedAtLocal: nowIso,
                        forcedSaveReason: options.reason || payload.reason || 'teachers_direct_save',
                        clientSavedAt: payload.clientSavedAt || Date.now()
                    }, { merge: true });
                }
                if (options && options.saveSnapshot === true) {
                    try {
                        await saveSchoolLocalStorageNow({ flushIframe: false, throwOnError: false });
                    } catch(snapshotErr) {
                        console.warn('تم حفظ بيانات المراقب الذكي في السحابة، لكن تعذر تحديث snapshot المحلي السحابي', snapshotErr);
                    }
                }
                return true;
            } catch(e) {
                console.warn('تعذر حفظ رسالة المراقب الذكي المباشرة في السحابة', e);
                if (options.throwOnError) throw e;
                return false;
            }
        }
        async function queueMonitoringStatePayloadSave(payload = {}, options = {}) {
            monitoringPayloadSaveQueued = { payload, options };
            if (monitoringPayloadSaveInFlight) return false;
            monitoringPayloadSaveInFlight = true;
            let lastResult = false;
            try {
                while (monitoringPayloadSaveQueued) {
                    const next = monitoringPayloadSaveQueued;
                    monitoringPayloadSaveQueued = null;
                    lastResult = await saveMonitoringStatePayloadNow(next.payload, next.options || {});
                }
                return lastResult;
            } finally {
                monitoringPayloadSaveInFlight = false;
            }
        }
        window.saveMonitoringStatePayloadNow = saveMonitoringStatePayloadNow;
        window.queueMonitoringStatePayloadSave = queueMonitoringStatePayloadSave;
        window.scheduleMonitoringStatePayloadSave = scheduleMonitoringStatePayloadSave;
        window.addEventListener('message', function(event) {
            try {
                const data = event && event.data;
                if (!data || (data.type !== 'monitoring_immediate_save_v2' && data.type !== 'monitoring_teachers_save_v2')) return;
                scheduleMonitoringStatePayloadSave(data, { reason: data.reason || data.type });
            } catch(e) {
                console.warn('تعذر استقبال رسالة حفظ المراقب الذكي', e);
            }
        });
        async function saveMonitoringAppDataNow(options = {}) {
            if (!window.currentSchoolId) return false;
            if (options.flushIframe) flushMonitoringIframeToLocalStorage();
            const app = getMonitoringIframeApp();
            let state = null;
            try {
                clearTimeout(monitoringAppSaveTimer);
                if (app && app.cloudSaveTimer) clearTimeout(app.cloudSaveTimer);
                if (app && typeof app.ensureAllGrade11OptionalRows === 'function') app.ensureAllGrade11OptionalRows();
                if (app && typeof app.getSerializableState === 'function') {
                    state = app.getSerializableState();
                } else {
                    const scopedKey = `monitoring_distribution_full_state_v4_${window.currentSchoolId}`;
                    const saved = localStorage.getItem(scopedKey) || localStorage.getItem('monitoring_distribution_full_state_v4');
                    state = saved ? JSON.parse(saved) : null;
                }
                if (!state || typeof state !== 'object') {
                    return await saveSchoolLocalStorageNow({ flushIframe: false, throwOnError: !!options.throwOnError });
                }
                return await saveMonitoringStatePayloadNow({
                    state,
                    teachers: Array.isArray(state.teachers) ? state.teachers : [],
                    reason: options.reason || 'manual_or_logout_save',
                    clientSavedAt: Date.now()
                }, { reason: options.reason || 'manual_or_logout_save', throwOnError: !!options.throwOnError });
            } catch(e) {
                console.warn('تعذر حفظ بيانات المراقب الذكي المباشرة في السحابة', e);
                const snapshotSaved = await saveSchoolLocalStorageNow({ flushIframe: false, throwOnError: false });
                if (options.throwOnError && !snapshotSaved) throw e;
                return !!snapshotSaved;
            }
        }
        async function runImmediateMonitoringSave(reason = 'immediate_edit_save') {
            if (!window.currentSchoolId) return false;
            clearTimeout(monitoringAppSaveTimer);
            if (monitoringImmediateSaveInFlight) {
                monitoringImmediateSaveQueued = true;
                return false;
            }
            monitoringImmediateSaveInFlight = true;
            try {
                return await saveMonitoringAppDataNow({ flushIframe: false, reason });
            } finally {
                monitoringImmediateSaveInFlight = false;
                if (monitoringImmediateSaveQueued) {
                    monitoringImmediateSaveQueued = false;
                    setTimeout(() => runImmediateMonitoringSave('queued_immediate_edit_save'), 0);
                }
            }
        }
        window.scheduleMonitoringAppDataSave = function() {
            if (!window.currentSchoolId) return;
            clearTimeout(monitoringAppSaveTimer);
            monitoringAppSaveTimer = setTimeout(() => runImmediateMonitoringSave('debounced_scheduled_from_smart_monitor'), 1000);
        };
        window.saveMonitoringAppDataNow = saveMonitoringAppDataNow;
        window.runImmediateMonitoringSave = runImmediateMonitoringSave;
        function flushMonitoringIframeToLocalStorage() {
            try {
                const frames = Array.from(document.querySelectorAll('iframe'));
                frames.forEach(frame => {
                    try {
                        const w = frame.contentWindow;
                        if (!w) return;
                        const app = w.monitoringDistributionApp;
                        if (!app) return;
                        if (app.cloudSaveTimer) clearTimeout(app.cloudSaveTimer);
                        if (typeof app.ensureAllGrade11OptionalRows === 'function') app.ensureAllGrade11OptionalRows();
                        if (typeof app.getSerializableState === 'function' && typeof app.safeSaveLocalSnapshot === 'function') {
                            const state = app.getSerializableState();
                            app.safeSaveLocalSnapshot(state);
                            try { window.__LAST_MONITORING_STATE_STRING = JSON.stringify(state); } catch(e) {}
                        }
                        if (typeof app.syncControlBridgeData === 'function') app.syncControlBridgeData();
                    } catch(innerErr) {}
                });
            } catch(e) {}
        }
        async function saveSchoolLocalStorageNow(options = {}) {
            if (!window.currentSchoolId || restoringSchoolStorage) return false;
            if (options.flushIframe) flushMonitoringIframeToLocalStorage();
            const items = {};
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (shouldPersistLocalKey(k)) {
                        const v = localStorage.getItem(k);
                        if (typeof v === 'string' && v.length < 850000) items[k] = v;
                    }
                }
                await setDoc(fbDoc(db, 'schools', window.currentSchoolId, 'controlLocalStorage', 'snapshot'), {
                    items,
                    updatedAt: serverTimestamp(),
                    updatedAtLocal: new Date().toISOString()
                }, { merge: true });
                return true;
            } catch(e) {
                console.warn('تعذر حفظ تخزين المراقب الذكي/الربط في السحابة', e);
                if (options.throwOnError) throw e;
                return false;
            }
        }
        window.scheduleSchoolLocalStorageSave = function() {
            if (!window.currentSchoolId || restoringSchoolStorage) return;
            clearTimeout(storageSaveTimer);
            storageSaveTimer = setTimeout(saveSchoolLocalStorageNow, 5000);
        };
        const originalSetItem = localStorage.setItem.bind(localStorage);
        localStorage.setItem = function(key, value) {
            originalSetItem(key, value);
            if (shouldPersistLocalKey(key)) window.scheduleSchoolLocalStorageSave();
        };

        function scopedDocPath(args) {
            if (!window.currentSchoolId || !args.length) return args;
            const first = String(args[0] || '');
            const scopedCollections = ['exam_records', 'exam_signature_indexes', 'exam_signature_items'];
            if (scopedCollections.includes(first)) return ['schools', window.currentSchoolId, ...args];
            return args;
        }
        function scopedCollectionPath(args) {
            if (!window.currentSchoolId || !args.length) return args;
            const first = String(args[0] || '');
            const scopedCollections = ['exam_records', 'exam_signature_indexes', 'exam_signature_items'];
            if (scopedCollections.includes(first)) return ['schools', window.currentSchoolId, ...args];
            return args;
        }
        function buildCloudDB() {
            return {
                db,
                provider: 'apps-script',
                doc: (database, ...path) => fbDoc(database, ...scopedDocPath(path)),
                collection: (database, ...path) => fbCollection(database, ...scopedCollectionPath(path)),
                getDoc, setDoc, deleteDoc, serverTimestamp, onSnapshot, getDocs, arrayUnion
            };
        }
        function readSchoolCodeFromUrl() {
            try {
                const params = new URLSearchParams(location.search);
                return String(params.get('s') || params.get('school') || '').trim();
            } catch(e) { return ''; }
        }
        function showLinkProblem(title, message) {
            showLogin();
            const t = document.getElementById('control-link-title');
            if (t) t.textContent = title;
            setLoginError(message);
            setAuthStatus('غير متصل', 'error');
        }
        async function openSchoolByCode(code) {
            code = String(code || '').trim();
            if (!/^[a-z0-9]{6,40}$/i.test(code)) {
                showLinkProblem('رابط غير صالح', 'افتح البرنامج من الرابط الخاص بمدرستك الذي أرسله لك مسؤول النظام.');
                return;
            }
            if (window.CONTROL_APP_AUTH_READY && lastOpenedSchoolCode === code) {
                showApp();
                return;
            }
            setAuthStatus('جاري التحقق من رابط المدرسة...', 'loading');
            let userData = null;
            try {
                const opened = await scriptPost({ action: 'open', s: code });
                userData = opened.school || {};
            } catch (e) {
                const c = String(e.code || e.message || '');
                if (c === 'LINK_NOT_FOUND') {
                    try { localStorage.removeItem(SCHOOL_LINK_STORAGE_KEY); } catch(_) {}
                    showLinkProblem('الرابط غير موجود', 'هذا الرابط غير صحيح أو تم حذفه. تواصل مع مسؤول النظام للحصول على رابط مدرستك.');
                    return;
                }
                if (c === 'LINK_DISABLED') {
                    showLinkProblem('الرابط معطّل', 'تم إيقاف رابط هذه المدرسة مؤقتًا. تواصل مع مسؤول النظام لإعادة تفعيله.');
                    return;
                }
                throw e;
            }
            try { localStorage.setItem(SCHOOL_LINK_STORAGE_KEY, code); } catch(e) {}
            window.currentSchoolId = code;
            window.currentSchoolInfo = { ...userData, schoolName: userData.name || userData.schoolName || '', directorate: userData.directorate || '' };

            await restoreSchoolLocalStorage(window.currentSchoolId);
            await restoreMonitoringAppDataFromCloud(window.currentSchoolId);
            window.cloudDB = buildCloudDB();
            window.monitoringCloud = window.cloudDB;
            try { localStorage.setItem(`monitoring_distribution_full_state_v4_${window.currentSchoolId}`, localStorage.getItem('monitoring_distribution_full_state_v4') || '{}'); } catch(e) {}
            lastOpenedSchoolCode = code;
            window.CONTROL_APP_AUTH_READY = true;
            setAuthStatus('متصل: ' + (window.currentSchoolInfo.schoolName || 'المدرسة'), 'success');
            showApp();
            window.dispatchEvent(new Event('cloud-ready'));
            window.dispatchEvent(new Event('control-auth-ready'));
        }
        window.logoutControlSystem = function() {
            if (window.__CONTROL_LOGOUT_RUNNING) return;
            window.__CONTROL_LOGOUT_RUNNING = true;
            window.__CONTROL_FAST_LOGOUT = true;
            try {
                setAuthStatus('جاري الخروج...', 'loading');
                clearTimeout(storageSaveTimer);
                clearTimeout(monitoringAppSaveTimer);
                try { flushMonitoringIframeToLocalStorage(); } catch(innerErr) {}
            } catch(e) {}
            try { localStorage.removeItem(AUTH_LAST_ACTIVITY_KEY); } catch(e) {}
            try {
                const root = document.getElementById('root');
                const login = document.getElementById('control-login-screen');
                if (root) root.style.display = 'none';
                if (login) login.style.display = 'flex';
            } catch(e) {}

            try { localStorage.removeItem(SCHOOL_LINK_STORAGE_KEY); } catch(e) {}
            setTimeout(() => {
                try { location.replace(location.pathname + '?closed=1'); } catch(e) { location.reload(); }
            }, 150);
        };
        window.addEventListener('pagehide', () => {
            try {
                if (window.__CONTROL_FAST_LOGOUT) return;
                flushMonitoringIframeToLocalStorage();
                if (window.currentSchoolId) { saveMonitoringAppDataNow({ flushIframe: false }); saveSchoolLocalStorageNow({ flushIframe: false }); }
            } catch(e) {}
        });

        (async function bootFromSchoolLink() {
            if (!SCRIPT_URL) {
                showLinkProblem('لم يتم الإعداد بعد', 'ضع رابط سكربت المراقب الذكي داخل SCRIPT_URL في الملف.');
                return;
            }
            let code = readSchoolCodeFromUrl();
            const closed = (() => { try { return new URLSearchParams(location.search).get('closed') === '1'; } catch(e) { return false; } })();
            if (!code && !closed) {
                try { code = localStorage.getItem(SCHOOL_LINK_STORAGE_KEY) || ''; } catch(e) {}
            }
            if (!code) {
                window.currentSchoolId = null;
                window.cloudDB = null;
                window.CONTROL_APP_AUTH_READY = false;
                showLinkProblem(closed ? 'تم الخروج' : 'افتح رابط مدرستك', closed ? 'للعودة إلى البرنامج افتح الرابط الخاص بمدرستك مرة أخرى.' : 'هذا البرنامج يعمل من الرابط الخاص بكل مدرسة. افتح الرابط الذي أرسله لك مسؤول النظام.');
                return;
            }
            try {
                markActivity();
                await openSchoolByCode(code);
            } catch(error) {
                console.error(error);
                showLinkProblem('تعذر فتح المدرسة', 'تعذر الاتصال بالسكربت: ' + (error.message || error.code) + ' — تأكد من الإنترنت ثم أعد تحميل الصفحة.');
            }
        })();
    </script>

                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-500 mb-1">الفترة الزمنية</label>
                                                    <input type="text" x-model="examForm.period" placeholder="08:00 ص" className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm">
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-500 mb-1">عدد المراقبين للجنة</label>
                                                    <input type="number" x-model.number="examForm.observersNeeded" min="1" max="4" className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm">
                                                </div>
                                            </div>
                                            <button @click="addExamDay()" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/20 transition-all mt-2">
                                                إضافة الامتحان للجدول
                                            </button>
                                        </div>
                                    </div>
                                    <div className="md:col-span-2">
                                        <div className="overflow-x-auto border border-slate-200 dark:border-slate-700 rounded-2xl">
                                            <table className="w-full text-right text-sm">
                                                <thead className="bg-slate-100 dark:bg-slate-700/50 text-slate-700 dark:text-slate-300 border-b border-slate-200">
                                                    <tr>
                                                        <th className="px-4 py-3">التاريخ</th>
                                                        <th className="px-4 py-3">المادة</th>
                                                        <th className="px-4 py-3">الفترة</th>
                                                        <th className="px-4 py-3 text-center">المراقبين للجنة</th>
                                                        <th className="px-4 py-3 text-center">الإجراءات</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template x-for="ex in exams" :key="ex.id">
                                                        <tr className="border-b border-slate-100 dark:border-slate-700/60">
                                                            <td className="px-4 py-3 font-mono text-xs" x-text="formatDateArabic(ex.date)"></td>
                                                            <td className="px-4 py-3 font-bold" x-text="ex.subject"></td>
                                                            <td className="px-4 py-3" x-text="ex.period"></td>
                                                            <td className="px-4 py-3 text-center font-bold text-indigo-600" x-text="ex.observersNeeded"></td>
                                                            <td className="px-4 py-3 text-center">
                                                                <button @click="deleteExam(ex.id)" className="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* القسم 4: الغياب والاعتذارات */}
                            <div x-show="currentTab === 'availability'" style="display: none;">
                                <div className="mb-6">
                                    <h2 className="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                        <i className="fa-solid fa-user-lock text-rose-500"></i>
                                        <span>إدارة الغياب والاعتذارات والقيود الزمنية</span>
                                    </h2>
                                    <p className="text-xs text-slate-500 mt-1">تحديد أيام الإجازات والغياب بعذر والاعتذارات لمعلمي المواد أثناء لجانهم.</p>
                                </div>
                                <div className="bg-slate-50 dark:bg-slate-700/30 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 text-center py-12">
                                    <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                                        <i className="fa-solid fa-shield-halved"></i>
                                    </div>
                                    <h3 className="text-base font-bold text-slate-800 dark:text-white mb-2">نظام القيود والاعتذارات الآلي مفعل</h3>
                                    <p className="text-xs text-slate-500 max-w-md mx-auto">يقوم النظام تلقائياً باستبعاد المعلمين غير المتاحين في تواريخ محددة أو المعلمين الذين يدرسون نفس مادة الامتحان اليومية.</p>
                                </div>
                            </div>

                            {/* القسم 5: التوزيع الذكي */}
                            <div x-show="currentTab === 'smart-dist'" style="display: none;">
                                <div className="mb-6 text-center max-w-2xl mx-auto">
                                    <div className="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-purple-500/20">
                                        <i className="fa-solid fa-brain animate-pulse"></i>
                                    </div>
                                    <h2 className="text-xl font-bold text-slate-900 dark:text-white">المراقب الذكي وتوليد التوزيعات</h2>
                                    <p className="text-xs text-slate-500 mt-1">يقوم خوارزم الذكاء الاصطناعي بتوزيع المراقبين على اللجان وتجنب تعارض التخصصات ومطابقة قرارات الكنترول العمانية.</p>
                                    
                                    <div className="mt-6">
                                        <button @click="runSmartDistribution()" className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white px-8 py-3.5 rounded-2xl font-bold text-base shadow-xl shadow-purple-600/30 transition-all flex items-center justify-center gap-3 mx-auto">
                                            <i className="fa-solid fa-wand-magic-sparkles text-lg" :class="distributing ? 'animate-spin' : ''"></i>
                                            <span>بدء توليد التوزيع الذكي للجان</span>
                                        </button>
                                    </div>
                                </div>

                                <div x-show="distributionSuccess" style="display: none;" className="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 p-5 rounded-2xl text-emerald-800 dark:text-emerald-200 flex items-center gap-4 max-w-xl mx-auto">
                                    <i className="fa-solid fa-circle-check text-2xl text-emerald-600"></i>
                                    <div>
                                        <h4 className="font-bold text-sm">تم التوزيع بنجاح تام!</h4>
                                        <p className="text-xs mt-0.5">يمكنك الآن استعراض الكشوفات اليومية وطباعة جداول المراقبين وإشعارات الواتساب.</p>
                                    </div>
                                </div>
                            </div>

                            {/* القسم 6: الكشوفات اليومية والطباعة */}
                            <div x-show="currentTab === 'daily-view'" style="display: none;">
                                <div className="flex items-center justify-between mb-6 no-print">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                            <i className="fa-solid fa-print text-cyan-500"></i>
                                            <span>الكشوفات اليومية وطباعة التوزيعات</span>
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-1">عرض وطباعة كشوفات لجان الامتحانات وتوزيع المعلمين اليومي.</p>
                                    </div>
                                    <button onclick="window.print()" className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg">
                                        <i className="fa-solid fa-print"></i> طباعة الكشف الرسمي
                                    </button>
                                </div>

                                <div className="print-area bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200">
                                    <div className="text-center border-b-2 border-double border-slate-800 pb-4 mb-6">
                                        <h3 className="font-bold text-sm" x-text="schoolSettings.directorate"></h3>
                                        <h2 className="text-base font-extrabold mt-1" x-text="schoolSettings.schoolName"></h2>
                                        <h4 className="text-xs font-bold text-slate-600 mt-2">كشف توزيع المراقبين على لجان الامتحانات النهائية</h4>
                                    </div>
                                    <div className="text-center py-12 text-slate-400 text-sm">
                                        اختر موعد امتحان أو قم بتوليد التوزيع الذكي لعرض كشوفات اللجان هنا للطباعة الرسمية المعتمدة.
                                    </div>
                                </div>
                            </div>

                            {/* القسم 7: الإحصائيات والتقارير */}
                            <div x-show="currentTab === 'statistics'" style="display: none;">
                                <div className="mb-6">
                                    <h2 className="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                        <i className="fa-solid fa-chart-pie text-amber-500"></i>
                                        <span>الإحصائيات والتقارير العامة للنظام</span>
                                    </h2>
                                    <p className="text-xs text-slate-500 mt-1">مؤشرات أداء الكنترول وتوزيع الحصص والمراقبين.</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
                                    <div className="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-2xl border border-slate-200">
                                        <span className="text-xs text-slate-400 font-bold uppercase">إجمالي المعلمين</span>
                                        <strong className="text-2xl block text-slate-800 dark:text-white mt-1" x-text="teachers.length"></strong>
                                    </div>
                                    <div className="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-2xl border border-slate-200">
                                        <span className="text-xs text-slate-400 font-bold uppercase">اللجان والشعب</span>
                                        <strong className="text-2xl block text-slate-800 dark:text-white mt-1" x-text="schoolClasses.length"></strong>
                                    </div>
                                    <div className="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-2xl border border-slate-200">
                                        <span className="text-xs text-slate-400 font-bold uppercase">الامتحانات المجدولة</span>
                                        <strong className="text-2xl block text-slate-800 dark:text-white mt-1" x-text="exams.length"></strong>
                                    </div>
                                    <div className="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-2xl border border-slate-200">
                                        <span className="text-xs text-slate-400 font-bold uppercase">نسبة الجاهزية</span>
                                        <strong className="text-2xl block text-emerald-600 mt-1">100%</strong>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </main>

                    {/* نافذة إضافة أو تعديل المعلم */}
                    <div x-show="teacherModalOpen" style="display: none;" className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                        <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-lg font-bold text-slate-900 dark:text-white" x-text="teacherForm.id ? 'تعديل بيانات المعلم' : 'إضافة معلم جديد'"></h3>
                                <button @click="teacherModalOpen = false" className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1">اسم المعلم الثلاثي</label>
                                    <input type="text" x-model="teacherForm.name" className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1">التخصص الأساسي</label>
                                    <select x-model="teacherForm.specialty" className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
                                        <template x-for="spec in specializations" :key="spec">
                                            <option :value="spec" x-text="spec"></option>
                                        </template>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1">رقم الهاتف النقال (لإشعارات واتساب)</label>
                                    <input type="text" x-model="teacherForm.phone" placeholder="968..." className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
                                </div>
                                <div className="flex items-center gap-3 pt-2">
                                    <input type="checkbox" id="m_ctrl" x-model="teacherForm.inControl" className="w-4 h-4 text-emerald-600 rounded">
                                    <label for="m_ctrl" className="text-xs font-semibold text-slate-700 dark:text-slate-300">متاح للمشاركة في أعمال الملاحظة والكنترول</label>
                                </div>
                                <div className="flex justify-end gap-2 pt-4">
                                    <button @click="teacherModalOpen = false" className="px-4 py-2 rounded-xl text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-300">إلغاء</button>
                                    <button @click="saveTeacher()" className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg">حفظ المعلم</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <!-- تضمين AlpineJS لتشغيل تفاعلات x-data / x-show المضمنة -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>
</html>
